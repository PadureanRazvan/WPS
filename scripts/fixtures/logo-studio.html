<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sherpa · Sculpture studio</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/fsp-logo.css">
    <script>
        // Developer-only measurements; no production API, Firebase or telemetry.
        window.sculptureMetrics = { startedAt: performance.now(), callbacks: 0, longTasks: [] };
        const nativeRequestFrame = window.requestAnimationFrame.bind(window);
        window.requestAnimationFrame = callback => nativeRequestFrame(time => {
            window.sculptureMetrics.callbacks++;
            callback(time);
        });
        if (PerformanceObserver.supportedEntryTypes.includes('longtask')) {
            new PerformanceObserver(list => window.sculptureMetrics.longTasks.push(...list.getEntries().map(entry => ({ start: entry.startTime, duration: entry.duration })))).observe({ type: 'longtask', buffered: true });
        }
    </script>
    <style>
        body { margin: 0; min-width: 300px; background: var(--primary-dark); color: var(--text-primary); font: 14px/1.5 system-ui, sans-serif; }
        header { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px 24px; padding: 25px 36px 18px; }
        h1 { font-size: 21px; font-weight: 650; letter-spacing: -.035em; }
        header p, footer { color: var(--text-secondary); font-size: 12px; }
        .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; padding: 0 36px 22px; border-bottom: 1px solid var(--border); }
        .toolbar label { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 12px; }
        .toolbar select, .toolbar button { font: inherit; color: var(--text-primary); background: var(--surface-elevated); border: 1px solid var(--border); border-radius: 9px; padding: 8px 12px; min-height: 38px; cursor: pointer; }
        .toolbar button:hover { background: var(--hover); }
        .toolbar input { width: 16px; height: 16px; }
        .toolbar input[type="range"] { width: 100px; }
        .toolbar input[type="number"] { width: 85px; height: 38px; border-radius: 8px; padding: 6px 9px; color: var(--text-primary); background: var(--surface-elevated); border: 1px solid var(--border); }
        .story-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        .toolbar output { min-width: 30px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
        main { padding: 26px 36px; }
        .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px; }
        .study { background: var(--surface-elevated); border: 1px solid var(--border); border-radius: 20px; padding: 22px 12px 24px; text-align: center; }
        .art { height: 250px; display: flex; align-items: center; justify-content: center; }
        .fsp-brand-logo { width: 250px; height: 250px; max-width: 100%; margin: 0; }
        .fsp-brand-logo img { object-fit: contain; }
        .study h2 { margin-top: 12px; font-size: 14px; font-weight: 550; letter-spacing: .01em; }
        .study p { margin-top: 4px; color: var(--text-secondary); font-size: 11px; }
        .inspect { margin-top: 10px; padding: 4px 8px; color: var(--accent); border: 0; border-radius: 5px; background: transparent; cursor: pointer; font: inherit; font-size: 11px; }
        .inspect:hover { background: var(--hover); }
        footer { padding: 0 36px 22px; }
        .diagnostics { margin: 0 36px 25px; padding: 16px; border: 1px solid var(--border); border-radius: 10px; }
        .diagnostics pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 12px 0 0; font-size: 12px; }
        body[data-view="single"] .grid { display: block; max-width: 800px; margin: auto; }
        body[data-view="single"] .study { display: none; }
        body[data-view="single"] .study.selected { display: block; }
        body[data-view="single"] .art { height: min(620px, 65vw); }
        body[data-view="single"] .fsp-brand-logo { width: min(600px, 63vw); height: min(600px, 63vw); }
        body[data-view="login"] .art { height: 230px; }
        body[data-view="login"] .fsp-brand-logo { width: 220px; height: 184.94px; }
        body[data-view="small"] .art { height: 180px; }
        body[data-view="small"] .fsp-brand-logo { width: 150px; height: 126.09px; }
        body[data-view="compact"] .art { height: 110px; }
        body[data-view="compact"] .fsp-brand-logo { width: 44px; height: 44px; }
        @media (max-width: 1150px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (max-width: 780px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } header, .toolbar, main, footer { padding-inline: 20px; } }
        @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } .art { height: 260px; } }
    </style>
</head>
<body>
    <header><h1>Sherpa / sculpture studio</h1><p>FSP Global · Five figures</p></header>
    <div class="toolbar" aria-label="Preview controls">
        <label>Theme <select id="theme"><option value="dark">Dark</option><option value="light">Light</option><option value="fsp">FSP</option><option value="aurora">Aurora</option><option value="coral">Coral</option></select></label>
        <label>Size <select id="view"><option value="grid">Gallery</option><option value="single">Close view</option><option value="login">Login · 220 px</option><option value="small">Sidebar · 150 px</option><option value="compact">Compact · 44 px</option></select></label>
        <button id="pause" type="button" aria-pressed="false">Pause motion</button>
        <button id="reset" type="button">Reset figures</button>
        <label><input id="cycle" type="checkbox"> Cycle automatically</label>
        <label>Turn <input id="yaw" type="range" min="-180" max="180" value="0"><output id="yaw-value">Auto</output></label>
        <label>Tilt <input id="pitch" type="range" min="-90" max="90" value="0"><output id="pitch-value">Auto</output></label>
        <button id="natural" type="button">Natural pose</button>
        <button id="measure" type="button" disabled>Measure 3 seconds</button>
        <button id="idle-check" type="button" disabled>Check paused idle</button>
        <div class="story-controls"><button id="play-story" type="button" disabled>Play the story</button><label>Time (seconds) <input id="story-time" type="number" value="0" min="0" step="0.05"></label><button id="seek-story" type="button" disabled>Show moment</button><button id="export-frame" type="button" disabled>Save sculpture frame</button></div>
    </div>
    <main><div class="grid" id="grid"></div></main>
    <footer>Activate a figure to advance · Drag to tilt · P to pause · Belonging → Care → Progress → Possibility → Continuity</footer>
    <section class="diagnostics" aria-label="Local performance diagnostics"><output id="startup-status" role="status">Preparing sculptures…</output><pre id="diagnostics" aria-live="polite"></pre></section>
    <script type="module">
        import { initLogoAnimation } from '/js/logo-animation.js';
        import { LOGO_SHAPE_NAMES } from '/js/logo-shapes.js';
        const params = new URLSearchParams(location.search);
        const names = LOGO_SHAPE_NAMES;
        const captions = {
            fsp: ['FSP Global', 'Belonging · Our shared starting point'],
            heart: ['Ruby heart', 'Care · Progress starts with people'],
            summit: ['Alpine summit', 'Progress · One step, then the next'],
            globe: ['Orbital globe', 'Possibility · A wider horizon'],
            infinity: ['Infinity ribbon', 'Continuity · Keep growing together']
        };
        const labels = names.map(name => captions[name][0]);
        const descriptions = names.map(name => captions[name][1]);
        const grid = document.getElementById('grid');
        const theme = document.getElementById('theme'), view = document.getElementById('view');
        const pause = document.getElementById('pause'), cycle = document.getElementById('cycle');
        let selected = names.includes(params.get('shape')) ? params.get('shape') : 'fsp';
        let paused = false;
        if ([...theme.options].some(option => option.value === params.get('theme'))) theme.value = params.get('theme');
        if ([...view.options].some(option => option.value === params.get('view'))) view.value = params.get('view');
        document.documentElement.dataset.theme = theme.value;
        document.body.dataset.view = view.value;
        grid.innerHTML = names.map((name, index) => `
            <section class="study ${name === selected ? 'selected' : ''}" data-figure="${name}">
                <div class="art ${view.value === 'compact' ? 'sidebar collapsed' : ''}">
                    <button id="figure-${index}" class="fsp-brand-logo" data-fsp-logo type="button">
                        <img class="fsp-logo-full" src="/assets/branding/fsp-global-still.webp" width="960" height="807" alt="FSP Global">
                        <img class="fsp-logo-compact" src="/assets/branding/fsp-global-compact-still.webp" width="960" height="768" alt="FSP Global">
                    </button>
                </div>
                <h2>${labels[index]}</h2><p>${descriptions[index]}</p>
                <button class="inspect" type="button" data-inspect="${name}">Inspect figure</button>
            </section>`).join('');
        const controllers = await Promise.all(names.map((_, i) => initLogoAnimation('figure-' + i, 300, { autoCycle: false })));
        if (controllers.some(controller => !controller)) throw new Error('A sculpture could not initialize.');
        controllers.forEach((controller, i) => { controller.pause(); for (let n = 0; n < i; n++) controller.next(); controller.resume(); });
        window.logoStudio = { names, controllers, shapeIndices: names.map(() => 0), ready: true };
        const storyTime = document.getElementById('story-time');
        const playStory = document.getElementById('play-story'), seekStory = document.getElementById('seek-story'), exportFrame = document.getElementById('export-frame');
        const supportsStory = typeof controllers[0].setInspectionTime === 'function';
        document.querySelector('.story-controls').hidden = !supportsStory;
        playStory.disabled = seekStory.disabled = exportFrame.disabled = !supportsStory;
        storyTime.max = String((controllers[0].getDiagnostics().storyDurationMs || 70000) / 1000 - 0.001);
        const startupMs = performance.now() - window.sculptureMetrics.startedAt;
        document.getElementById('startup-status').textContent = `Ready · ${Math.round(startupMs)} ms to prepare all five preview instances`;
        const measure = document.getElementById('measure'), idleCheck = document.getElementById('idle-check');
        measure.disabled = idleCheck.disabled = false;
        const diagnosticOutput = document.getElementById('diagnostics');
        function reportDiagnostics(extra = {}) {
            const data = {
                startupMs: Math.round(startupMs),
                startupLongTasks: window.sculptureMetrics.longTasks.filter(task => task.start < startupMs).map(task => Math.round(task.duration)),
                ...extra,
                figures: controllers.map((controller, i) => ({ figure: names[i], ...controller.getDiagnostics() }))
            };
            diagnosticOutput.textContent = JSON.stringify(data, null, 2);
        }
        measure.addEventListener('click', async () => {
            measure.disabled = idleCheck.disabled = true;
            diagnosticOutput.textContent = 'Measuring for three seconds…';
            const startedAt = performance.now(), callbacks = window.sculptureMetrics.callbacks;
            await new Promise(resolve => setTimeout(resolve, 3000));
            reportDiagnostics({ elapsedMs: Math.round(performance.now() - startedAt), frameCallbacks: window.sculptureMetrics.callbacks - callbacks });
            measure.disabled = idleCheck.disabled = false;
        });
        idleCheck.addEventListener('click', async () => {
            measure.disabled = idleCheck.disabled = true;
            diagnosticOutput.textContent = 'Checking paused callbacks…';
            const saved = controllers.map(controller => controller.getDiagnostics().paused);
            controllers.forEach(controller => controller.pause());
            await new Promise(resolve => setTimeout(resolve, 250));
            const callbacks = window.sculptureMetrics.callbacks;
            await new Promise(resolve => setTimeout(resolve, 1500));
            reportDiagnostics({ pausedIdleFrameCallbacks: window.sculptureMetrics.callbacks - callbacks });
            controllers.forEach((controller, i) => { if (!saved[i]) controller.resume(); });
            measure.disabled = idleCheck.disabled = false;
        });
        const yaw = document.getElementById('yaw'), pitch = document.getElementById('pitch');
        function inspectRotation() {
            controllers.forEach(controller => controller.setInspectionRotation([Number(pitch.value) * Math.PI / 180, Number(yaw.value) * Math.PI / 180, 0]));
            document.getElementById('yaw-value').value = yaw.value + '°';
            document.getElementById('pitch-value').value = pitch.value + '°';
        }
        yaw.addEventListener('input', inspectRotation);
        pitch.addEventListener('input', inspectRotation);
        function naturalPose() {
            controllers.forEach(controller => controller.setInspectionRotation());
            yaw.value = pitch.value = '0';
            document.getElementById('yaw-value').value = document.getElementById('pitch-value').value = 'Auto';
        }
        document.getElementById('natural').addEventListener('click', naturalPose);
        function setView() {
            document.body.dataset.view = view.value;
            grid.querySelectorAll('.study').forEach(card => card.classList.toggle('selected', card.dataset.figure === selected));
            grid.querySelectorAll('.art').forEach(art => {
                art.classList.toggle('sidebar', view.value === 'compact');
                art.classList.toggle('collapsed', view.value === 'compact');
            });
        }
        function selectStory() {
            selected = 'fsp'; view.value = 'single'; setView(); naturalPose();
            controllers.forEach(controller => controller.setAutoCycle(true));
            cycle.checked = true;
        }
        function showStoryMoment() {
            const seconds = Number(storyTime.value);
            if (!Number.isFinite(seconds) || seconds < 0) return;
            selectStory();
            paused = true;
            controllers.forEach(controller => controller.pause());
            controllers[0].setInspectionTime(seconds * 1000);
            pause.textContent = 'Resume motion'; pause.setAttribute('aria-pressed', 'true');
            reportDiagnostics({ inspectedSeconds: seconds });
        }
        seekStory.addEventListener('click', showStoryMoment);
        storyTime.addEventListener('keydown', event => { if (event.key === 'Enter') showStoryMoment(); });
        playStory.addEventListener('click', () => {
            storyTime.value = '0'; showStoryMoment();
            paused = false; controllers.forEach(controller => controller.resume());
            pause.textContent = 'Pause motion'; pause.setAttribute('aria-pressed', 'false');
        });
        exportFrame.addEventListener('click', async () => {
            showStoryMoment();
            exportFrame.disabled = true;
            try {
                const blob = await controllers[0].captureFrame();
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `sherpa-story-${storyTime.value.replace('.', '-')}.png`;
                link.click(); setTimeout(() => URL.revokeObjectURL(link.href), 1000);
            } catch (error) { diagnosticOutput.textContent = error.message; }
            finally { exportFrame.disabled = false; }
        });
        view.addEventListener('change', setView);
        theme.addEventListener('change', () => {
            const previousPause = controllers.map(controller => controller.getDiagnostics().paused);
            controllers.forEach(controller => controller.pause());
            document.documentElement.dataset.theme = theme.value;
            window.dispatchEvent(new CustomEvent('sherpa-theme-changed'));
            controllers.forEach((controller, i) => { if (!previousPause[i]) controller.resume(); });
        });
        pause.addEventListener('click', () => {
            paused = !paused;
            controllers.forEach(controller => paused ? controller.pause() : controller.resume());
            pause.textContent = paused ? 'Resume motion' : 'Pause motion';
            pause.setAttribute('aria-pressed', String(paused));
        });
        cycle.addEventListener('change', () => controllers.forEach(controller => controller.setAutoCycle(cycle.checked)));
        document.getElementById('reset').addEventListener('click', () => {
            naturalPose();
            controllers.forEach((controller, i) => {
                controller.pause();
                for (let step = 0; step < 6 && (controller.getDiagnostics().shape !== names[i] || controller.getDiagnostics().transitioning); step++) controller.next();
                if (!paused) controller.resume();
            });
        });
        grid.addEventListener('click', event => {
            const inspect = event.target.closest('[data-inspect]');
            if (!inspect) return;
            selected = inspect.dataset.inspect;
            view.value = 'single';
            setView();
            document.getElementById('figure-' + names.indexOf(selected)).focus();
        });
        const updateLabels = () => grid.querySelectorAll('.study').forEach((card, i) => {
            const state = card.querySelector('[data-fsp-logo]').dataset.logoShape || names[i];
            card.querySelector('h2').textContent = state.split('-to-').map(name => labels[names.indexOf(name)] || name).join(' → ');
            card.querySelector('p').textContent = descriptions[names.indexOf(state.split('-to-').at(-1))] || '';
        });
        const observer = new MutationObserver(updateLabels);
        grid.querySelectorAll('[data-fsp-logo]').forEach(control => observer.observe(control, { attributes: true, attributeFilter: ['data-logo-shape'] }));
        updateLabels();
        window.addEventListener('pagehide', () => { observer.disconnect(); controllers.forEach(controller => controller.dispose()); }, { once: true });
    </script>
</body>
</html>
